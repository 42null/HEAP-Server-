server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:heap}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:heap_app}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that entities match
      # what Flyway created - it never generates or alters tables itself.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    # Required, >= 32 chars. Signs and verifies the Bearer tokens.
    jwt-secret: ${HEAP_SERVER_JWT_SECRET}
    token-ttl: 1h
    # The single local login. Password has no default on purpose.
    username: ${HEAP_USERNAME:admin}
    password: ${HEAP_PASSWORD}
